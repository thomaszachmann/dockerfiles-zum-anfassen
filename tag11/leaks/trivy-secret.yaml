# trivy-secret.yaml – eigene Regel für den Lab-Key von notes.
# Aufruf: trivy image --scanners secret --secret-config leaks/trivy-secret.yaml …
rules:
  - id: notes-api-key
    category: notes
    title: notes API key
    severity: CRITICAL
    regex: lab-api-key-[0-9]+
    keywords:
      - lab-api-key
