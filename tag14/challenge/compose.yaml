# compose.yaml – Lösung der Challenge Tag 14: Key aus environment-Quelle,
# Datei nur für den jeweiligen Dienst lesbar (uid/gid/mode wirken hier).
name: notes

services:
  notes-api:
    build:
      context: notes-api
      network: host
      secrets:
        - artifact_token
    image: notes-api:tag14
    container_name: notes-api
    environment:
      NOTES_API_KEY_FILE: /run/secrets/notes_api_key
    secrets:
      - source: notes_api_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    ports:
      - "127.0.0.1:8080:8080"

  notes-worker:
    build: notes-worker
    image: notes-worker:tag14
    container_name: notes-worker
    environment:
      NOTES_API_URL: http://notes-api:8080
      NOTES_API_KEY_FILE: /run/secrets/notes_api_key
    secrets:
      - source: notes_api_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    depends_on:
      notes-api:
        condition: service_healthy

  notes-web:
    build:
      context: notes-web
      secrets:
        - npmrc
    image: notes-web:tag14
    container_name: notes-web
    entrypoint: ["/bin/sh", "-c"]
    command:
      - NOTES_API_KEY="$$(cat /run/secrets/notes_api_key)" exec node server.js
    environment:
      NOTES_API_URL: http://notes-api:8080
    secrets:
      - source: notes_api_key
        uid: "1000"            # User node im Image node:24-alpine
        gid: "1000"
        mode: 0400
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - notes-api

secrets:
  artifact_token:
    environment: ARTIFACT_TOKEN
  npmrc:
    file: ./secrets/npmrc
  notes_api_key:
    environment: NOTES_API_KEY
