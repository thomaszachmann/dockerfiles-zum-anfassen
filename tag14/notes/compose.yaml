# compose.yaml – Stand Ende Tag 14
name: notes

services:
  notes-api:
    build:
      context: notes-api
      network: host            # Lab: artifact-server auf 127.0.0.1:8081 (Tag 13)
      secrets:
        - artifact_token       # Build-Secret (Tag 13)
    image: notes-api:tag14
    container_name: notes-api
    environment:
      NOTES_API_KEY_FILE: /run/secrets/notes_api_key
    secrets:
      - notes_api_key          # Tag 14: Laufzeit-Secret als Datei
    ports:
      - "127.0.0.1:8080:8080"

  notes-worker:
    build: notes-worker
    image: notes-worker:tag14
    container_name: notes-worker
    environment:
      NOTES_API_URL: http://notes-api:8080
      NOTES_API_KEY_FILE: /run/secrets/notes_api_key
    secrets:
      - notes_api_key
    depends_on:
      notes-api:
        condition: service_healthy

  notes-web:
    build:
      context: notes-web
      secrets:
        - npmrc                # Build-Secret (Tag 13)
    image: notes-web:tag14
    container_name: notes-web
    # notes-web kennt kein *_FILE: kleiner Wrapper liest die Datei beim Start
    entrypoint: ["/bin/sh", "-c"]
    command:
      - NOTES_API_KEY="$$(cat /run/secrets/notes_api_key)" exec node server.js
    environment:
      NOTES_API_URL: http://notes-api:8080
    secrets:
      - notes_api_key
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - notes-api

secrets:
  artifact_token:
    environment: ARTIFACT_TOKEN
  npmrc:
    file: ./secrets/npmrc
  notes_api_key:
    file: ./secrets/notes_api_key.txt
